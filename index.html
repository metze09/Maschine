<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maschineninfo | Kallfass</title>
<style>
  :root {
    --rot: #db0525;      /* Kallfass-Rot */
    --text: #474747;     /* Fließtext wie auf kallfass.de */
    --dunkel: #2b2b2b;
    --grau: #f4f4f4;     /* Abschnittshintergrund */
    --linie: #dedede;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text); background: var(--grau); }
  a { color: var(--rot); }

  header { background: #fff; border-bottom: 1px solid var(--linie); }
  header .innen { max-width: 560px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header img { height: 34px; width: auto; display: block; }
  header .bereich { font-size: .85rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--rot); }

  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 40px; display: grid; gap: 24px; }
  h1 { margin: 0; font-size: 1.9rem; line-height: 1.2; font-weight: 700; color: var(--text); }

  .karte { background: #fff; padding: 24px; display: grid; gap: 18px; border-top: 3px solid var(--rot); }
  .zeile { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; }
  .zeile svg { width: 20px; height: 20px; margin-top: 4px; fill: var(--rot); }
  .zeile span { display: block; font-size: .85rem; }
  .zeile strong { display: block; font-size: 1.35rem; font-weight: 700; color: var(--dunkel); word-break: break-word; }

  .knopf { display: block; text-align: center; padding: 14px 16px; border-radius: 5px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; border: 2px solid var(--rot); }
  .knopf.haupt { background: var(--rot); color: #fff; }
  .knopf.zweit { background: #fff; color: var(--rot); }
  .knopf:focus-visible { outline: 3px solid var(--dunkel); outline-offset: 2px; }
  .knoepfe { display: grid; gap: 12px; }
  .hinweis { margin: 0; font-size: .95rem; }

  footer { max-width: 560px; margin: 0 auto; padding: 0 20px 32px; font-size: .8rem; display: grid; gap: 4px; }
  footer a { color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="innen">
    <a href="https://www.kallfass.de/"><img src="https://www.kallfass.de/fileadmin/user_upload/images/logo.svg" alt="Kallfass"></a>
    <span class="bereich">Service</span>
  </div>
</header>

<main>
  <h1>Maschineninfo</h1>

  <div class="karte">
    <div class="zeile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.6 12.4 2.6A2 2 0 0 0 11 2H4a2 2 0 0 0-2 2v7c0 .6.2 1.1.6 1.4l9 9a2 2 0 0 0 2.8 0l7-7a2 2 0 0 0 0-2.8ZM6.5 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"/></svg>
      <div><span>Maschinennummer</span><strong id="nr">–</strong></div>
    </div>
    <div class="zeile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.8 1.7 1l.4 2.6h4l.4-2.6c.6-.2 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
      <div><span>Maschinentyp</span><strong id="typ">–</strong></div>
    </div>
  </div>
  <p class="hinweis" id="fehlt" hidden>In diesem Link sind keine Maschinendaten enthalten.</p>

  <div class="knoepfe">
    <a class="knopf haupt" id="anrufen">Service anrufen</a>
    <a class="knopf zweit" id="kontakt">Kontaktformular</a>
  </div>
  <p class="hinweis">Service-Hotline: <strong id="hotline"></strong></p>
</main>

<footer>
  <div>KALLFASS Verpackungsmaschinen GmbH · Siemensstraße 8 · 72622 Nürtingen</div>
  <div><a href="https://www.kallfass.de/impressum">Impressum</a> · <a href="https://www.kallfass.de/datenschutz">Datenschutz</a></div>
</footer>

<script>
  const HOTLINE = "+49 7022 607109";
  const KONTAKT = "https://www.kallfass.de/kontakt";

  const link = new URLSearchParams(location.search);
  const nr = link.get("nr") || "", typ = link.get("typ") || "";

  document.getElementById("nr").textContent = nr || "–";
  document.getElementById("typ").textContent = typ || "–";
  document.getElementById("fehlt").hidden = !!(nr || typ);
  if (nr) document.title = "Maschine " + nr + " | Kallfass";

  document.getElementById("anrufen").href = "tel:" + HOTLINE.replace(/[^\d+]/g, "");
  document.getElementById("hotline").textContent = HOTLINE;
  document.getElementById("kontakt").href = KONTAKT;
</script>
</body>
</html>
